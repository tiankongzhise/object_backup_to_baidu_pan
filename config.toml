# 百度网盘备份工具配置文件
# 本文件仅包含非敏感配置
# 敏感信息（数据库密码、Token等）请在 .env 文件中配置

# ==================== 源文件夹配置 ====================
[source]
# 需要备份的源文件夹路径
path = "D:/测试用例"
# ZIP压缩包密码（可选，建议在 .env 中通过环境变量配置更安全）
password = "H_x123456"

# ==================== 存储路径配置 ====================
[storage]
# 压缩文件存放目录
compress_dir = "D:/backup_compress"
# 解压验证临时目录
extract_dir = "D:/backup_extract"
# 磁盘使用限制（GB），超过此限制将暂停处理
disk_limit_gb = 80

# ==================== 限制配置 ====================
[limits]
# 单文件大小限制（GB），超过此大小的文件需要人工处理
max_file_size_gb = 20
# 单文件夹直接子文件数限制，超过需要人工处理
max_files_per_folder = 200

# ==================== 压缩配置 ====================
[compression]
# 压缩级别: 0=存储(不压缩), 1=最快, 9=最高压缩比
# 建议使用 0，因为ZIP压缩包本身不再压缩
level = 0

# ==================== 上传配置 ====================
[upload]
# 分片大小（MB）
chunk_size_mb = 20
# 上传失败重试次数
retry_times = 5

# ==================== 数据库连接池配置 ====================
# 注意：数据库连接信息（主机、用户名、密码等）请在 .env 文件中配置
# 此处仅配置连接池参数
[database]
# 连接池大小
pool_size = 5
# 最大溢出连接数
max_overflow = 10
# 连接超时时间（秒）
pool_timeout = 30
# 连接回收时间（秒），0表示不回收
pool_recycle = 3600
# 是否打印SQL语句（仅调试时使用）
echo = false
# 避免数据库连接不稳定带来的失败
pool_pre_ping = True
