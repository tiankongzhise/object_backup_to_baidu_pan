[project]
name = "object-backup-to-baidu-pan"
version = "0.2.0"
description = "Backup files to Baidu Net Disk with encryption and verification"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "python-dotenv>=1.0.0",
    "sqlalchemy>=2.0.0",
    "pymysql>=1.1.0",
    "pyqt6>=6.6.0",
    "tqdm>=4.66.0",
    "pandas>=2.3.3",
    "pyzipper>=0.3.6",
    "requests>=2.32.5",
    "dowhen>=0.1.0",
    "python-dateutil>=2.9.0.post0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]

[tool.hatch.build.targets.wheel]
packages = ["src/object_backup_to_baidu_pan"]


[[tool.uv.index]]
name = "tuna-mirro"
url="https://pypi.tuna.tsinghua.edu.cn/simple"
default=true

[[tool.uv.index]]
name = "ustc-mirro"
url="https://pypi.mirrors.ustc.edu.cn/simple/"


[[tool.uv.index]]
name = "aliyun-mirro"
url="http://mirrors.aliyun.com/pypi/simple/"
